<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
  <!-- Google Fonts: Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Subtle noise grain texture overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Warm intimate background lighting -->
  <div class="ambient-background" aria-hidden="true">
    <div class="warm-glow glow-top"></div>
    <div class="warm-glow glow-center"></div>
  </div>

  <!-- Main viewport centered letter -->
  <main class="letter-viewport">
    <div class="letter-stage">
      
      <!-- Subtle top star accent -->
      <div class="star-symbol" aria-hidden="true">✦</div>

      <!-- Preserved handwritten letter -->
      <div class="letter-frame">
        <img 
          src="assets/note.jpg" 
          alt="Handwritten note" 
          class="letter-image"
          loading="eager"
        >
      </div>

      <!-- Elegant minimal caption -->
      <p class="caption">for you.</p>

    </div>
  </main>

</body>
</html>
