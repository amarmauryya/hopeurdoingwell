<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
  <!-- Google Fonts: Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Edge Cinematic Vignette Overlay -->
  <div class="vignette-overlay" aria-hidden="true"></div>

  <!-- Interactive Candlelight Torch Follow Glow -->
  <div class="candlelight-glow" id="candlelight" aria-hidden="true"></div>

  <!-- Full-screen centered viewport -->
  <main class="viewport">
    
    <!-- Top elegant text -->
    <p class="top-text">I live under your skin.</p>

    <!-- Preserved handwritten note wrapper -->
    <div class="note-wrapper">
      <img 
        src="assets/note.jpg" 
        alt="Handwritten note" 
        class="note-img"
        loading="eager"
      >
    </div>

    <!-- Small understated caption -->
    <p class="caption">for you.</p>

  </main>

  <script>
    // Smooth interactive candlelight cursor/touch follow
    const light = document.getElementById('candlelight');
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentX = targetX;
    let currentY = targetY;

    function updateLightPosition(e) {
      if (e.touches && e.touches[0]) {
        targetX = e.touches[0].clientX;
        targetY = e.touches[0].clientY;
      } else {
        targetX = e.clientX;
        targetY = e.clientY;
      }
    }

    window.addEventListener('mousemove', updateLightPosition, { passive: true });
    window.addEventListener('touchmove', updateLightPosition, { passive: true });

    function animate() {
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;
      light.style.transform = `translate3d(${currentX - 250}px, ${currentY - 250}px, 0)`;
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
