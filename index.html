<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
  <!-- Google Fonts: Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Full-screen centered viewport -->
  <main class="viewport">
    
    <!-- Preserved handwritten note wrapper -->
    <div class="note-wrapper">
      <img 
        src="assets/note.jpg" 
        alt="Handwritten note" 
        class="note-img"
        loading="eager"
      >
    </div>

    <!-- Small understated caption -->
    <p class="caption">for you.</p>

  </main>

</body>
</html>
